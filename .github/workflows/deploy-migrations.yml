name: Deploy Migrations to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ""

jobs:
  deploy-migrations:
    name: Deploy to Production Supabase
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Deployment not confirmed. Please type 'deploy' to confirm."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: |
          echo "🔗 Linking to Supabase project: ${{ secrets.PRODUCTION_PROJECT_ID }}"
          supabase link --project-ref ${{ secrets.PRODUCTION_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check migration sync
        run: |
          echo "🔍 Validating local/remote migration sync..."

          # Get migration list and find remote-only migrations
          MIGRATION_OUTPUT=$(supabase migration list 2>/dev/null || echo "")

          # Extract remote-only migrations
          # Look for lines that start with spaces (empty local) followed by | and a migration number
          REMOTE_ONLY=$(echo "$MIGRATION_OUTPUT" | awk '
            /^[ ]+\|/ {
              # Split by |
              split($0, parts, "|")
              # Get the remote column (2nd column after split)
              remote = parts[2]
              gsub(/^[ \t]+|[ \t]+$/, "", remote)
              # Check if it looks like a migration version
              if (remote ~ /^[0-9]+$/ && length(remote) >= 8) {
                print remote
              }
            }
          ')

          if [ -n "$REMOTE_ONLY" ]; then
            echo "::warning::발견된 원격 전용 마이그레이션:"
            echo "$REMOTE_ONLY"
            echo "::warning::이 마이그레이션들은 로컬에 없습니다. migration repair를 실행합니다."

            # Auto-repair: mark remote-only migrations as reverted
            echo "🔧 원격 전용 마이그레이션을 reverted 상태로 표시합니다..."
            for version in $REMOTE_ONLY; do
              echo "  - Repairing migration: $version"
              supabase migration repair --status reverted "$version" || echo "::warning::Failed to repair $version"
            done

            echo "✅ Migration repair 완료. 이제 배포를 진행합니다."
          else
            echo "✅ 로컬/원격 마이그레이션 동기화 완료"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check pending migrations
        run: |
          echo "📋 Checking pending migrations..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run migrations
        run: |
          echo "🔍 Running dry-run to verify migrations..."
          supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

      - name: Push migrations to production
        run: |
          echo "🚀 Deploying migrations to production..."
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

      - name: Verify migration status
        if: success()
        run: |
          echo "✅ Verifying migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify success
        if: success()
        run: |
          echo "::notice::✅ Migrations deployed successfully to production!"
          echo "Deployment completed at $(date)"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::❌ Migration deployment failed. Check the logs for details."
          exit 1
